---
- name: Setup minio
  hosts: minio
  become: true
  gather_facts: false

  vars:
    minio_admin_pwd: "{{ lookup('env', 'ANSIBLE_VAR_MINIO_ADMIN_PASSWORD') }}"
    minio_data_dir: /mnt/data/minio
    minio_deb_url: "https://dl.min.io/server/minio/release/linux-amd64/archive/minio_20250907161309.0.0_amd64.deb"

  tasks:

    - name: Wait until ready
      ansible.builtin.include_tasks: ../../tasks/wait_until_ready.yaml

    - name: Ensure LVM disk
      ansible.builtin.include_tasks: ../../tasks/lvm_mount.yaml
      vars:
        lvm_vg: data_vg
        lvm_lv: data_lv
        lvm_pvs: /dev/sdb
        lvm_mount: /mnt/data

    - name: Validate MinIO admin password
      ansible.builtin.assert:
        that:
          - minio_admin_pwd | length >= 8
        fail_msg: "Password must be ≥8 chars"

    - name: Create MinIO group
      ansible.builtin.group:
        name: "minio-user"
        state: present

    - name: Create MinIO user
      ansible.builtin.user:
        name: "minio-user"
        group: "minio-user"
        system: yes
        create_home: no

    - name: Create data directory
      ansible.builtin.file:
        path: "{{ minio_data_dir }}"
        state: directory
        owner: "minio-user"
        group: "minio-user"
        mode: '0755'

    - name: Install MinIO
      ansible.builtin.apt:
        deb: "{{minio_deb_url}}"
        state: present
      notify:
        - Reload systemd
        - Restart MinIO

    - name: Create MinIO env config
      ansible.builtin.copy:
        dest: /etc/default/minio
        content: |
          MINIO_ROOT_USER=admin
          MINIO_ROOT_PASSWORD="{{minio_admin_pwd}}"
          MINIO_VOLUMES="{{minio_data_dir}}"
          MINIO_OPTS=""
          MINIO_CONSOLE_ADDRESS=:9001
          MINIO_BROWSER_REDIRECT_URL=http://minio.homelab.local
      notify:
        - Restart MinIO

    - name: Create systemd service file
      ansible.builtin.copy:
        dest: /etc/systemd/system/minio.service
        content: |
          [Unit]
          Description=MinIO
          Documentation=https://min.io/docs/minio/linux/index.html
          Wants=network-online.target
          After=network-online.target
          AssertFileIsExecutable=/usr/local/bin/minio

          [Service]
          WorkingDirectory=/usr/local
          User=minio-user
          Group=minio-user
          ProtectProc=invisible
          EnvironmentFile=-/etc/default/minio
          ExecStartPre=/bin/bash -c "if [ -z \"${MINIO_VOLUMES}\" ]; then echo \"Variable MINIO_VOLUMES not set in /etc/default/minio\"; exit 1; fi"
          ExecStart=/usr/local/bin/minio server $MINIO_OPTS $MINIO_VOLUMES
          Restart=always
          LimitNOFILE=65536
          TasksMax=infinity
          TimeoutStopSec=infinity
          SendSIGKILL=no

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart MinIO

    - name: Write ansible run timestamp
      ansible.builtin.include_tasks: ../../tasks/ansible_sentinel.yaml

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Restart MinIO
      ansible.builtin.systemd:
        name: minio
        state: restarted
        enabled: yes
